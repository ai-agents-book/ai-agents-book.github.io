<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="AI Agents">
  <!-- Drawn for 16 px first. The cover's dot-wave turns to mush at that size,
       so this keeps only what survives: the navy field, one light curve, and
       the gold node at its crest. Checked by rasterising to 16 and 32 and
       looking, not by assuming. -->
  <rect width="32" height="32" rx="6" fill="#143a63"/>
  <path d="M3 22 C9 22 8 10 16 10 C24 10 23 22 29 22" fill="none"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="10" r="3.4" fill="#f0a733"/>
</svg>
